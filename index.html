<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junkatana — Ports e Romhacks</title>
  <meta name="description" content="Ports de jogos, traduções, romhacks e emuladores feitos por Junkatana. Game ports, translations, romhacks and emulators by Junkatana.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <meta property="og:title" content="Junkatana">
  <meta property="og:image" content="https://junkatana.github.io/img/perfil.png">
</head>
<body>
  <div class="lingua" role="group" aria-label="Idioma / Language">
    <button data-lingua="pt">PT</button>
    <button data-lingua="en">EN</button>
  </div>

  <div class="estrelas" aria-hidden="true"></div>

  <header class="topo">
    <div class="heroi">
      <div class="retrato janela">
        <img class="perfil" src="img/perfil.png" alt="Junkatana" width="160" height="160">
      </div>
      <div class="janela fala">
        <h1>JUNKATANA</h1>
        <p class="subtitulo" data-t="saudacao"></p>
        <span class="seta" aria-hidden="true">▼</span>
      </div>
    </div>
    <nav class="menu janela">
      <a href="#projetos" data-t="projetos"></a>
      <a href="historia.html" data-t="historia"></a>
      <a href="#sobre" data-t="sobre"></a>
      <a href="https://www.youtube.com/@junkatana" target="_blank" rel="noopener">YouTube</a>
      <a href="https://x.com/junkatanagames" target="_blank" rel="noopener">X</a>
      <a href="https://github.com/junkatana" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main>
    <section id="projetos">
      <h2 class="titulo-secao" data-t="projetos"></h2>
      <div class="filtros" role="group">
        <button class="filtro ativo" data-tipo="todos" data-t="todos"></button>
        <button class="filtro" data-tipo="port" data-t="filtro_port"></button>
        <button class="filtro" data-tipo="traducao" data-t="filtro_traducao"></button>
        <button class="filtro" data-tipo="romhack" data-t="filtro_romhack"></button>
        <button class="filtro" data-tipo="emulador" data-t="filtro_emulador"></button>
      </div>
      <div id="lista" class="grade"></div>
      <p id="vazio" class="vazio" data-t="vazio" hidden></p>
    </section>

    <section id="sobre" class="sobre janela">
      <h2 data-t="sobre"></h2>
      <p data-t="sobre_texto"></p>
      <p class="aviso" data-t="aviso"></p>
    </section>
  </main>

  <footer>
    <p>© <span id="ano"></span> Junkatana · <span data-t="rodape"></span></p>
  </footer>

  <script src="projetos.js"></script>
  <script src="comum.js"></script>
  <script src="script.js"></script>
</body>
</html>
